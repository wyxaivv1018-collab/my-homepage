<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>v</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:        #f5f3ef;
    --surface:   #fdfdfc;
    --border:    #e4e1dc;
    --text:      #1c1c1e;
    --text-muted:#787880;
    --accent:    #3b4cc0;
    --accent-dim:#2f3da0;
    --radius:    8px;
  }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    letter-spacing: -.01em;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 60px 24px 32px;
  }

  /* ===== 顶栏 ===== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 56px;
  }

  .logo {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }

  .logo span {
    font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", "Consolas", monospace;
    color: var(--accent);
    font-weight: 500;
  }

  .status {
    font-size: 13px;
    color: var(--text-muted);
  }

  /* ===== hero ===== */
  .hero {
    margin-bottom: 48px;
  }

  .hero h1 {
    font-size: 52px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -.03em;
    margin-bottom: 14px;
    line-height: 1.08;
  }

  .hero h1 .mono {
    font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", "Consolas", monospace;
    font-size: 44px;
    color: var(--accent);
    font-weight: 550;
  }

  .hero .desc {
    font-size: 16px;
    color: var(--text-muted);
    max-width: 460px;
    line-height: 1.6;
  }

  /* ===== chat 卡片 ===== */
  .chat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0;
    overflow: hidden;
    margin-bottom: 48px;
    box-shadow: 0 1px 4px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }

  .chat-body {
    padding: 0;
  }

  .chat-window {
    padding: 20px 22px 16px;
    min-height: 130px;
    max-height: 260px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--surface);
  }

  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13.5px;
    line-height: 1.55;
    word-break: break-word;
  }

  .msg.bot {
    align-self: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
  }

  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
  }

  .msg .meta {
    font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", "Consolas", monospace;
    font-size: 10.5px;
    opacity: .5;
    margin-top: 5px;
    text-align: right;
  }

  .quick-qs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 22px;
    border-top: 1px solid var(--border);
  }

  .quick-q {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 15px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all .18s;
    font-family: inherit;
  }

  .quick-q:hover {
    background: var(--surface);
    border-color: var(--accent);
    color: var(--accent);
  }

  .input-row {
    display: flex;
    gap: 0;
    border-top: 1px solid var(--border);
  }

  .input-row input {
    flex: 1;
    border: none;
    padding: 15px 22px;
    font-size: 14px;
    background: var(--surface);
    color: var(--text);
    outline: none;
    font-family: inherit;
  }

  .input-row input::placeholder {
    color: #b8b8c4;
    font-size: 14px;
  }

  .input-row button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 15px 28px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    letter-spacing: .01em;
    transition: background .2s;
  }

  .input-row button:hover { background: var(--accent-dim); }

  /* ===== section 通用标题 ===== */
  .section-title {
    font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", "Consolas", monospace;
    font-size: 12.5px;
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 14px;
    letter-spacing: .02em;
  }
  .footer {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .footer .copy {
    font-size: 12px;
    color: #aaa;
  }

  .footer .links {
    display: flex;
    gap: 20px;
    font-size: 13px;
  }

  .footer .links a {
    color: var(--text-muted);
    text-decoration: none;
    transition: color .2s;
  }

  .footer .links a:hover { color: var(--accent); }

  /* ===== 响应式 ===== */
  @media (max-width: 560px) {
    .container { padding: 36px 18px 24px; }
    .hero { margin-bottom: 36px; }
    .hero h1 { font-size: 36px; }
    .hero h1 .mono { font-size: 30px; }
    .chat-card { margin-bottom: 32px; }
    .msg { max-width: 88%; }
    .input-row button { padding: 15px 18px; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- ========== 顶栏 ========== -->
  <header class="topbar">
    <div class="logo"><span>~/v</span></div>
    <div class="status">open to messages</div>
  </header>

  <!-- ========== hero ========== -->
  <section class="hero">
    <h1>Hi, I'm <span class="mono">v</span></h1>
    <p class="desc">关注 AI 应用、内容表达和知识整理。</p>
  </section>

  <!-- ========== 对话 ========== -->
  <div class="section-title">// ask me anything</div>
  <div class="chat-card">
    <div class="chat-body">
      <div class="chat-window" id="chatWindow">
        <div class="msg bot">
          我是庞广龙的 AI 分身，有什么想了解的可以直接问我。
          <div class="meta">just now</div>
        </div>
      </div>

      <div class="quick-qs">
        <button class="quick-q" data-q="你是谁？">你是谁？</button>
        <button class="quick-q" data-q="你做过什么？">你做过什么？</button>
        <button class="quick-q" data-q="最近在做什么？">最近在做什么？</button>
        <button class="quick-q" data-q="怎么联系你？">怎么联系你？</button>
      </div>

      <div class="input-row">
        <input type="text" id="chatInput" placeholder="$ type something…" maxlength="200">
        <button id="sendBtn">↵ send</button>
      </div>
    </div>
  </div>

  <!-- ========== footer ========== -->
  <footer class="footer">
    <span class="copy">v &copy; 2026</span>
    <div class="links">
      <a href="mailto:15916289021@163.com">Email</a>
      <a href="#">GitHub</a>
      <a href="javascript:void(0)" id="wechatBtn">WeChat</a>
    </div>
  </footer>

</div>

<!-- ========== wechat 二维码弹窗 ========== -->
<div id="wechatOverlay" style="display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.5);cursor:pointer;" onclick="this.style.display='none'">
  <img src="img/wechat.jpg" alt="WeChat QR" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);max-width:280px;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.3);">
</div>

<script>
  document.getElementById("wechatBtn").addEventListener("click", function(e){ e.preventDefault(); document.getElementById("wechatOverlay").style.display="block"; });
  const knowledge = {
    default: [
      "这个问题我目前还不太会回答，试试快捷提问吧。",
      "这个我不太确定，要不直接联系我本人确认一下？",
    ],
    "忙什么": [
      "最近主要在整理自己的作品集，也在尝试用 AI 做一些更完整的小项目。",
    ],
    "作品": [
      "目前还在搭建阶段，这个主页就是其中一个。后续会把一些用 AI 做的小项目放上来。",
    ],
    "联系": [
      "如需进一步了解我的经历或沟通岗位机会，欢迎通过下方电话或微信直接联系我。",
    ],
    "你是谁": [
      "我是庞广龙，平时喜欢研究 AI 怎么用到实际的事情上。比较关注 AI 应用、内容表达和知识整理这几个方向。特点是能把复杂的东西讲清楚。",
    ],
    "做过什么": [
      "我比较擅长把复杂问题讲清楚，长期关注的方向是 AI 应用、内容表达和知识整理。具体的工作经历可以直接问我本人，这里没有特别完整的记录。",
    ],
    "擅长": [
      "比较擅长把复杂问题讲清楚，长期关注 AI 应用、内容表达和知识整理。",
    ],
    "兴趣": [
      "对 AI 应用、内容创作和知识管理都比较感兴趣。",
    ],
    "特点": [
      "坦诚直率，能把复杂的东西讲清楚。",
    ],
  };

  function matchAnswer(input) {
    const q = input.toLowerCase();
    if (/最近|在干嘛|忙|现在干嘛/.test(q)) return knowledge["忙什么"];
    if (/你做过什么|做过什么/.test(q)) return knowledge["做过什么"];
    if (/作品|项目|成果/.test(q)) return knowledge["作品"];
    if (/联系|找到|微信|邮箱/.test(q)) return knowledge["联系"];
    if (/谁|你是|分身/.test(q)) return knowledge["你是谁"];
    if (/擅长|会|能力|方向/.test(q)) return knowledge["擅长"];
    if (/兴趣|爱好|喜欢/.test(q)) return knowledge["兴趣"];
    if (/特点|性格/.test(q)) return knowledge["特点"];
    return null;
  }

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function addMessage(text, type) {
    const t = new Date();
    const time = t.getHours().toString().padStart(2,"0") + ":" + t.getMinutes().toString().padStart(2,"0");
    const html = `<div class="msg ${type}">${text}<div class="meta">${time}</div></div>`;
    chatWindow.insertAdjacentHTML("beforeend", html);
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function sendMessage(input) {
    const text = input.trim();
    if (!text) return;
    addMessage(text, "user");
    setTimeout(() => {
      const answers = matchAnswer(text);
      addMessage(answers ? pick(answers) : pick(knowledge.default), "bot");
    }, 500 + Math.random() * 600);
  }

  const chatWindow = document.getElementById("chatWindow");
  const chatInput = document.getElementById("chatInput");
  const sendBtn = document.getElementById("sendBtn");

  sendBtn.addEventListener("click", () => { sendMessage(chatInput.value); chatInput.value = ""; });
  chatInput.addEventListener("keydown", e => { if (e.key === "Enter") { sendMessage(chatInput.value); chatInput.value = ""; } });
  document.querySelectorAll(".quick-q").forEach(b => b.addEventListener("click", () => sendMessage(b.dataset.q)));
</script>

</body>
</html>
